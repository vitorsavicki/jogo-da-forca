name: 💡 Sugerir uma ideia
description: Nova funcionalidade ou melhoria
title: "[Ideia] "
labels: [enhancement]
body:
  - type: textarea
    id: problema
    attributes:
      label: Que problema resolve?
      placeholder: "Fico frustrado quando..."
    validations:
      required: true
  - type: textarea
    id: solucao
    attributes:
      label: Como você imagina a solução?
    validations:
      required: true
  - type: textarea
    id: alternativas
    attributes:
      label: Alternativas consideradas
