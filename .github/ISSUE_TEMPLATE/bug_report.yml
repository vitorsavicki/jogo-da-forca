name: 🐛 Relatar um bug
description: Algo não está funcionando como deveria
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: descricao
    attributes:
      label: O que aconteceu?
      description: Descreva o bug de forma clara.
      placeholder: "Ao clicar em X, aconteceu Y, mas eu esperava Z..."
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Como reproduzir
      description: Passo a passo para ver o problema.
      placeholder: "1. Abrir o jogo\n2. Clicar em...\n3. Ver o erro"
    validations:
      required: true
  - type: input
    id: navegador
    attributes:
      label: Navegador e sistema
      placeholder: "Ex.: Chrome 120, Windows 11"
  - type: textarea
    id: logs
    attributes:
      label: Erros do console (F12)
      render: shell
